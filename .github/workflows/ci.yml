name: CI

on:
  pull_request:
  push:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          # Node 20.19+/22 required: some deps (eslint-visitor-keys@5) drop Node 18.
          node-version: "22"

      # This repo intentionally gitignores package-lock.json (.gitignore), so we
      # use `npm install` (not `npm ci`) and skip the lockfile-based npm cache.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test
